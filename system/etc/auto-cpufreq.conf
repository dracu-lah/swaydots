[charger]
governor = powersave
energy_performance_preference = balance_performance
platform_profile = performance
scaling_min_freq = 400000
turbo = auto
enable_thresholds = true
start_threshold = 50
stop_threshold = 80


[battery]
governor = powersave
energy_performance_preference = balance_power
platform_profile = balanced
scaling_min_freq = 400000
turbo = auto
enable_thresholds = true
start_threshold = 50
stop_threshold = 80
